services:
  face-detection-poc:
    build: .
    container_name: face-detection-poc
    ports:
      - "5173:5173"
    volumes:
      # Mount source directory for hot-reload
      - .:/app
      # Persist node_modules
      - /app/node_modules
    environment:
      - NODE_ENV=development
    stdin_open: true
    tty: true
